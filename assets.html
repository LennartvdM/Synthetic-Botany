<title>Synthetic Botany Assets</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: one kind at a time fills the page as a row of specimens; one strip of controls above */
:root { color-scheme: dark; --void: #14242b; --panel: #0f1b21; --line: #2a3e46; --ink: #d9e2e3; --dim: #8298a0; --pick: #e6c36a;
  --body: #e6c36a; --base: #d9604f; --flourish: #6f9fe0; --rooting: #e08ac0;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; --sans: system-ui, -apple-system, "Segoe UI", sans-serif; }
html, body { height: 100%; margin: 0; }
body { background: var(--panel); color: var(--ink); font: 13px/1.4 var(--sans); display: flex; flex-direction: column; overflow: hidden; }
#bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
#bar label { display: flex; gap: 6px; align-items: center; color: var(--dim); font: 11.5px var(--mono); }
select { font: 12px var(--mono); color: var(--ink); background: #172a32; border: 1px solid var(--line); border-radius: 4px; padding: 4px 7px; }
select:focus-visible, input:focus-visible { outline: 2px solid var(--pick); outline-offset: 1px; }
#key { display: flex; gap: 12px; flex-wrap: wrap; font: 11.5px var(--mono); color: var(--dim); }
#key span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; background: var(--c); }
#stage { position: relative; flex: 1; min-height: 0; background: var(--void); overflow: hidden; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#note { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); bottom: 8px; font: 11px var(--mono); color: var(--ink); background: rgba(15, 27, 33, 0.8); padding: 3px 9px; border-radius: 4px; pointer-events: none; }
</style>

<div id="bar">
  <label>kind <select id="kind" aria-label="Which kind to show"></select></label>
  <label><input id="tint" type="checkbox"> colour by role</label>
  <div id="key" hidden><span style="--c: var(--body)">body</span><span style="--c: var(--base)">base</span><span style="--c: var(--flourish)">flourish</span><span style="--c: var(--rooting)">rooting</span></div>
</div>
<div id="stage"><canvas id="view" aria-label="Specimens of one kind, side by side. Drag to turn, scroll to zoom."></canvas><div id="note" role="status">building…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="cheats/fantastic.js"></script>
<script src="assets/kinds.js"></script>
<script>
const T = THREE, $ = (id) => document.getElementById(id);
const renderer = new T.WebGLRenderer({ canvas: $('view'), antialias: true });
renderer.outputEncoding = T.sRGBEncoding; renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
const scene = new T.Scene(); scene.background = new T.Color(0x14242b);
const cam = new T.PerspectiveCamera(24, 1, 0.05, 200);
scene.add(new T.HemisphereLight(0xeaf2f5, 0x3a4d55, 0.62));
const sun = new T.DirectionalLight(0xfff3e2, 0.62); sun.position.set(4, 9, 6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.012;
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 40 }); scene.add(sun);
const fill = new T.DirectionalLight(0xcfe3ee, 0.2); fill.position.set(-5, 3, -4); scene.add(fill);
const floor = new T.Group(); floor.rotation.x = -Math.PI / 2;
floor.add(new T.Mesh(new T.CircleGeometry(40, 64), new T.MeshBasicMaterial({ color: new T.Color(0x41565f).convertSRGBToLinear() })));
const shade = new T.Mesh(new T.CircleGeometry(40, 64), new T.ShadowMaterial({ opacity: 0.3 })); shade.position.z = 0.002; shade.receiveShadow = true; floor.add(shade); scene.add(floor);
const mat = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.92 });
const lin = (h) => new T.Color(h).convertSRGBToLinear();
const clay = lin(0xe7e0d4), deep = lin(0x9a7f78), ROLE = { body: lin(0xe6c36a), base: lin(0xd9604f), flourish: lin(0x6f9fe0), rooting: lin(0xe08ac0) };
const group = new T.Group(); scene.add(group);
let target = new T.Vector3(0, 0.85, 0), rad = 15, az = 0.55, pol = 1.25, run = 0;

function paint(mesh) {
  const tone = mesh.userData.tone, tint = $('tint').checked ? ROLE[mesh.userData.role] : clay, col = mesh.geometry.attributes.color.array;
  for (let q = 0; q < tone.length; q++) { const k = Math.pow(Math.min(1, Math.max(0, tone[q])), 1.3), l = 0.36 + 0.64 * k; col[q * 3] = (deep.r + (tint.r - deep.r) * k) * l; col[q * 3 + 1] = (deep.g + (tint.g - deep.g) * k) * l; col[q * 3 + 2] = (deep.b + (tint.b - deep.b) * k) * l; }
  mesh.geometry.attributes.color.needsUpdate = true;
}
function place() { cam.position.set(target.x + rad * Math.sin(pol) * Math.sin(az), target.y + rad * Math.cos(pol), target.z + rad * Math.sin(pol) * Math.cos(az)); cam.lookAt(target); renderer.render(scene, cam); }
function fit() { const el = $('stage'); renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(el.clientWidth, el.clientHeight, false); cam.aspect = el.clientWidth / el.clientHeight; cam.updateProjectionMatrix(); place(); }
// specimens take a second or two each, so they are built one at a time and appear as they finish
function show() {
  const ki = +$('kind').value, K = Kinds.kinds[ki], mine = ++run;
  while (group.children.length) { group.children[0].geometry.dispose(); group.remove(group.children[0]); }
  window.__ready = false; rad = 15 / Math.max(0.7, Math.min(1.2, cam.aspect * 0.62)); place();
  (function next(si) {
    if (mine !== run) return;
    if (si >= K.specimens) { $('note').textContent = K.name + ': ' + K.specimens + ' specimens, each as body, base, rooting and flourish'; window.__ready = true; return; }
    $('note').textContent = 'building ' + K.name + ', specimen ' + (si + 1) + ' of ' + K.specimens + '…';
    setTimeout(() => {
      if (mine !== run) return;
      for (const p of Kinds.specimen(ki, si, 0.022).parts) {
        const g = new T.BufferGeometry();
        g.setAttribute('position', new T.BufferAttribute(p.pos, 3)); g.setAttribute('normal', new T.BufferAttribute(p.nrm, 3)); g.setAttribute('color', new T.BufferAttribute(new Float32Array(p.tone.length * 3), 3)); g.setIndex(new T.BufferAttribute(p.idx, 1));
        const m = new T.Mesh(g, mat); m.userData = { tone: p.tone, role: p.role }; m.castShadow = m.receiveShadow = true; m.position.x = (si - (K.specimens - 1) / 2) * 2.35; paint(m); group.add(m);
      }
      place(); next(si + 1);
    }, 30);
  })(0);
}
Kinds.kinds.forEach((k, i) => { const o = document.createElement('option'); o.value = i; o.textContent = k.name; $('kind').append(o); });
let drag = null;
$('view').addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; $('view').setPointerCapture(e.pointerId); });
$('view').addEventListener('pointerup', () => (drag = null));
$('view').addEventListener('pointermove', (e) => { if (!drag) return; az -= (e.clientX - drag[0]) * 0.008; pol = Math.min(3.05, Math.max(0.08, pol - (e.clientY - drag[1]) * 0.008)); drag = [e.clientX, e.clientY]; place(); });
$('view').addEventListener('wheel', (e) => { e.preventDefault(); rad *= Math.exp(e.deltaY * 0.0012); place(); }, { passive: false });
$('kind').addEventListener('change', show);
$('tint').addEventListener('change', () => { $('key').hidden = !$('tint').checked; group.children.forEach(paint); place(); });
new ResizeObserver(fit).observe($('stage'));
fit(); show();
window.__assets = { set: (k, tint) => { $('kind').value = k; $('tint').checked = !!tint; $('key').hidden = !tint; show(); } };
</script>
