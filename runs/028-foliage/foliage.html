<title>Sketchbook Page 11</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: the shapes fill the page; one strip of controls above; a name under each shape */
:root { color-scheme: dark; --void: #14242b; --panel: #0f1b21; --line: #2a3e46; --ink: #d9e2e3; --dim: #8298a0; --pick: #e6c36a;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; --sans: system-ui, -apple-system, "Segoe UI", sans-serif; }
html, body { height: 100%; margin: 0; }
body { background: var(--panel); color: var(--ink); font: 13px/1.4 var(--sans); display: flex; flex-direction: column; overflow: hidden; }
#bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
#bar label { display: flex; gap: 6px; align-items: center; color: var(--dim); font: 11.5px var(--mono); }
#bar p { margin: 0; color: var(--dim); font-size: 12px; flex: 1 1 260px; min-width: 0; }
select { font: 12px var(--mono); color: var(--ink); background: #172a32; border: 1px solid var(--line); border-radius: 4px; padding: 4px 7px; }
select:focus-visible { outline: 2px solid var(--pick); outline-offset: 1px; }
#stage { position: relative; flex: 1; min-height: 0; background: var(--void); overflow: hidden; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.tag { position: absolute; transform: translate(-50%, 4px); font: 11px var(--mono); color: var(--ink); background: rgba(15, 27, 33, 0.72); padding: 1px 7px; border-radius: 3px; white-space: nowrap; pointer-events: none; }
</style>

<div id="bar">
  <label>shape <select id="which" aria-label="Which shape to show"><option value="-1">the whole page</option></select></label>
  <label>show <select id="cut" aria-label="How to show it"><option value="none">whole</option><option value="half">near half removed</option><option value="slice">thin slice</option></select></label>
  <label><input id="tint" type="checkbox"> colour by layer</label>
  <span id="key" hidden style="font: 11.5px var(--mono); color: var(--dim)"><b style="color:#d8d2c6">strands</b> · <b style="color:#e6c36a">torn parts</b> · <b style="color:#e08ac0">slivers and shell</b> · <b style="color:#6f9fe0">bark</b> · <b style="color:#86c98f">scar</b> · <b style="color:#c0553a">root</b> · <b style="color:#e09a6a">root of a root</b> · <b style="color:#8d9aa0">ground</b></span>
  <p>A sketchbook page: quick, rough, thrown away if nothing sticks. Sketches appear one at a time. Drag to turn, scroll to zoom.</p>
</div>
<div id="stage"><canvas id="view" aria-label="Sculpted solid shapes"></canvas><div id="tags"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="cheats/fantastic.js"></script>
<script src="sketch/page5.js"></script>
<script src="trees.js"></script>
<script src="sketch/page7.js"></script>
<script src="runs/028-foliage/leaves.js"></script>
<script src="runs/028-foliage/sprays.js"></script>
<script src="runs/028-foliage/atlas.js"></script>
<script src="runs/028-foliage/twigs.js"></script>
<script src="runs/028-foliage/foliage.js"></script>
<script>
const T = THREE, $ = (id) => document.getElementById(id);
const renderer = new T.WebGLRenderer({ canvas: $('view'), antialias: true });
renderer.outputEncoding = T.sRGBEncoding; renderer.localClippingEnabled = true; renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
const scene = new T.Scene(); scene.background = new T.Color(0x14242b);
const cam = new T.PerspectiveCamera(24, 1, 0.05, 200);
scene.add(new T.HemisphereLight(0xeaf2f5, 0x3a4d55, 0.62));
const sun = new T.DirectionalLight(0xfff3e2, 0.62); sun.position.set(4, 9, 6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.012;
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 40 }); scene.add(sun);
const fill = new T.DirectionalLight(0xcfe3ee, 0.2); fill.position.set(-5, 3, -4); scene.add(fill);
const floor = new T.Group(); floor.rotation.x = -Math.PI / 2;
floor.add(new T.Mesh(new T.CircleGeometry(40, 64), new T.MeshBasicMaterial({ color: new T.Color(0x41565f).convertSRGBToLinear() })));
const shade = new T.Mesh(new T.CircleGeometry(40, 64), new T.ShadowMaterial({ opacity: 0.3 })); shade.position.z = 0.002; shade.receiveShadow = true; floor.add(shade); scene.add(floor);
const mat = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, side: T.DoubleSide, shadowSide: T.DoubleSide });
const clay = new T.Color(0xe7e0d4).convertSRGBToLinear(), deep = new T.Color(0x9a7f78).convertSRGBToLinear();

const shapes = [], orbMat = new T.MeshStandardMaterial({ color: new T.Color(0xfff6e0).convertSRGBToLinear(), emissive: new T.Color(0xffe9b8).convertSRGBToLinear(), emissiveIntensity: 0.85, roughness: 0.6 });
// each shape takes about a second to mesh, so they are built one at a time and appear as they finish
// clay by default; or each layer in its own colour, to see which layer is doing what
const LAYER = [0xd8d2c6, 0xe6c36a, 0xe08ac0, 0x6f9fe0, 0x86c98f, 0x8d9aa0, 0xc0553a, 0xe09a6a].map((c) => new T.Color(c).convertSRGBToLinear());
const ROCK = new T.Color(0x9aa6ab).convertSRGBToLinear();   // the ground is not the tree: a cooler, darker clay
function paint(sh) { const col = sh.mesh.geometry.attributes.color.array, on = $('tint').checked && sh.layer;
  for (let q = 0; q < sh.tone.length; q++) { const k = Math.pow(Math.min(1, Math.max(0, sh.tone[q])), 1.3), l = 0.36 + 0.64 * k, c = on ? LAYER[sh.layer[q]] : sh.layer && sh.layer[q] === 5 ? ROCK : clay; col[q * 3] = (deep.r + (c.r - deep.r) * k) * l; col[q * 3 + 1] = (deep.g + (c.g - deep.g) * k) * l; col[q * 3 + 2] = (deep.b + (c.b - deep.b) * k) * l; }
  sh.mesh.geometry.attributes.color.needsUpdate = true; }

const { TEX, drawLeaf, plumeAtlas, frondAtlas, coreMat, stemMat, frondMat } = Atlas;
function addShape(i) {
  const s = Fantastic.build(i), g = new T.BufferGeometry(), col = new Float32Array(s.tone.length * 3);
  g.setAttribute('position', new T.BufferAttribute(s.pos, 3)); g.setAttribute('normal', new T.BufferAttribute(s.nrm, 3)); g.setAttribute('color', new T.BufferAttribute(col, 3)); g.setIndex(new T.BufferAttribute(s.idx, 1));
  const m = new T.Mesh(g, mat); m.castShadow = m.receiveShadow = true; scene.add(m);
  // branchlets, flat, sprouting off the core branches, with sprigs along them
  const gr = (window.__grown || [])[i];
  if (gr && window.Twigs) {
    const qs = new URLSearchParams(location.search);
    const fol = new T.Group(); m.add(fol);
    const build = (over) => {
      while (fol.children.length) fol.remove(fol.children[0]);
      // only what the page itself knows; everything else is the generator's default, so there is one place to
      // change a rule and the two benches cannot drift apart
      const q = {}; for (const k of ['from', 'every', 'len', 'droop', 'sprigs', 'size', 'core', 'cores', 'cant']) if (qs.get(k)) q[k] = +qs.get(k);
      const Z = Twigs.build(gr, Object.assign({ R0: (window.__R0 || [0.2])[i], seed: 23 + i }, q, over || {}));
      const put = (buf, material, cast) => {
        if (!buf || !buf.idx.length) return;
        const g2 = new T.BufferGeometry();
        g2.setAttribute('position', new T.BufferAttribute(buf.pos, 3));
        g2.setAttribute('normal', new T.BufferAttribute(buf.nrm, 3));
        g2.setAttribute('uv', new T.BufferAttribute(buf.uv, 2));
        g2.setAttribute('wind', new T.BufferAttribute(buf.col, 3));
        g2.setIndex(new T.BufferAttribute(buf.idx, 1));
        const mm = new T.Mesh(g2, material); mm.castShadow = cast; mm.receiveShadow = true; fol.add(mm);
      };
      put(Z.stem, stemMat, true); put(Z.core, coreMat, true); put(Z.leaf, frondMat, true);
      window.__counts = { twigs: Z.twigs, sprigs: Z.sprigs, cores: Z.cores };
      // the leaf's shape and value live in the atlas, not in the geometry, so a hypothesis about either
      // has to redraw the two canvases; they cost nothing beside the tree
      Atlas.redraw(over && over.tex);
      // a rebuilt canopy that is never drawn is the old canopy: the screenshot would be the frame before it
      if (window.__ready) place();
    };
    build(null);
    // the tree takes minutes to grow and the foliage takes milliseconds, so a hypothesis should not cost a regrow
    window.__foliage = build;
  }
  const tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = s.name; $('tags').append(tag);
  shapes.push({ mesh: m, tag, centre: s.centre, tone: s.tone, layer: s.layer }); paint(shapes[shapes.length - 1]);
}
Fantastic.names.forEach((name, i) => { const o = document.createElement('option'); o.value = i; o.textContent = name; $('which').append(o); });
let target = new T.Vector3(), rad = 14, az = 0.45, pol = 1.2;
function place() {
  cam.position.set(target.x + rad * Math.sin(pol) * Math.sin(az), target.y + rad * Math.cos(pol), target.z + rad * Math.sin(pol) * Math.cos(az));
  cam.lookAt(target); cam.updateMatrixWorld(); renderer.render(scene, cam);
  const el = $('stage'), v = new T.Vector3();
  for (const s of shapes) {
    if (!s.mesh.visible) { s.tag.hidden = true; continue; }
    v.set(s.mesh.position.x + s.centre[0], 0, s.mesh.position.z).project(cam);
    s.tag.hidden = v.z > 1; s.tag.style.left = ((v.x + 1) / 2) * el.clientWidth + 'px'; s.tag.style.top = ((1 - v.y) / 2) * el.clientHeight + 'px';
  }
}
function arrange() {
  const one = +$('which').value, m = $('cut').value;
  shapes.forEach((s, i) => { s.mesh.visible = one < 0 || one === i; s.mesh.position.set(one < 0 ? (i - 0.5) * 2.4 : 0, 0, 0); });
  const w = 0.012;
  mat.clippingPlanes = one >= 0 && m === 'half' ? [new T.Plane(new T.Vector3(0, 0, -1), 0)] : one >= 0 && m === 'slice' ? [new T.Plane(new T.Vector3(0, 0, -1), w), new T.Plane(new T.Vector3(0, 0, 1), w)] : [];
  mat.needsUpdate = true;
  if (one < 0) { target.set(0, 0.5, 0); rad = 9.5; az = 0.6; pol = 1.32; target.set(0, 1.0, 0); }
  else if (shapes[one]) { target.set(0, 1.05, 0); rad = 7.2; az = m === 'none' ? 0.5 : 0; pol = m === 'slice' ? 1.5 : 1.25; }
  place();
}
function fit() { const el = $('stage'); renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(el.clientWidth, el.clientHeight, false); cam.aspect = el.clientWidth / el.clientHeight; cam.updateProjectionMatrix(); place(); }
let drag = null;
$('view').addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; $('view').setPointerCapture(e.pointerId); });
$('view').addEventListener('pointerup', () => (drag = null));
$('view').addEventListener('pointermove', (e) => { if (!drag) return; az -= (e.clientX - drag[0]) * 0.008; pol = Math.min(3.05, Math.max(0.08, pol - (e.clientY - drag[1]) * 0.008)); drag = [e.clientX, e.clientY]; place(); });
$('view').addEventListener('wheel', (e) => { e.preventDefault(); rad *= Math.exp(e.deltaY * 0.0012); place(); }, { passive: false });
$('which').addEventListener('change', arrange); $('cut').addEventListener('change', arrange);
new ResizeObserver(fit).observe($('stage'));
fit();
(function next(i) { if (i >= Fantastic.names.length) { window.__ready = true; return; } addShape(i); arrange(); setTimeout(() => next(i + 1), 30); })(0);
$('tint').addEventListener('change', () => { $('key').hidden = !$('tint').checked; shapes.forEach(paint); place(); });
// fit the whole of shape i, foliage and all, into the frame. A hand-picked distance is a guess that goes stale
// the moment the canopy changes size, and a cropped tree cannot be judged at all.
window.__fit = (i, margin) => {
  const sh = shapes[i]; if (!sh) return;
  const bb = new T.Box3().setFromObject(sh.mesh), c = bb.getCenter(new T.Vector3());
  target.copy(c); rad = bb.getSize(new T.Vector3()).length() * 0.5 / Math.sin((cam.fov * Math.PI / 180) / 2) * (margin || 1.06);
  place();
};
window.__cheats = { arrange, fit: window.__fit, set: (i, cut, a, p, r, ty, tint) => { if (tint !== undefined && $('tint').checked !== !!tint) { $('tint').checked = !!tint; $('key').hidden = !tint; shapes.forEach(paint); } $('which').value = i; $('cut').value = cut || 'none'; arrange(); if (a != null) az = a; if (p != null) pol = p; if (r) rad = r; if (ty != null) target.y = ty; place(); } };
</script>
