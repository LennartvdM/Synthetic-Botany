<title>Tear Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: the body fills the page; sliders in one strip above it */
:root { color-scheme: dark; --void: #14242b; --panel: #0f1b21; --line: #2a3e46; --ink: #d9e2e3; --dim: #8298a0; --pick: #e6c36a;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; --sans: system-ui, -apple-system, "Segoe UI", sans-serif; }
html, body { height: 100%; margin: 0; }
body { background: var(--panel); color: var(--ink); font: 13px/1.4 var(--sans); display: flex; flex-direction: column; overflow: hidden; }
#bar { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
#bar label { display: grid; grid-template-columns: auto 110px 34px; gap: 6px; align-items: center; color: var(--dim); font: 11.5px var(--mono); }
#bar output { color: var(--ink); font-variant-numeric: tabular-nums; text-align: right; }
input[type="range"] { width: 100%; accent-color: #e4ddd1; }
input:focus-visible { outline: 2px solid var(--pick); outline-offset: 1px; }
#stage { position: relative; flex: 1; min-height: 0; background: var(--void); overflow: hidden; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#note { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); bottom: 8px; font: 11px var(--mono); color: var(--ink); background: rgba(15, 27, 33, 0.8); padding: 3px 9px; border-radius: 4px; pointer-events: none; }
</style>

<div id="bar">
  <label>inflate <input id="steps" type="range" min="0" max="400" step="10" value="100"><output></output></label>
  <label>strength <input id="strength" type="range" min="0.05" max="0.5" step="0.01" value="0.2"><output></output></label>
  <label>clench <input id="clench" type="range" min="0.02" max="0.3" step="0.01" value="0.08"><output></output></label>
  <label>thickness <input id="thick" type="range" min="0.02" max="0.16" step="0.01" value="0.06"><output></output></label>
  <label>expanse <input id="expanse" type="range" min="0" max="0.6" step="0.02" value="0.2"><output></output></label>
  <label>tension <input id="tension" type="range" min="0" max="0.5" step="0.01" value="0.15"><output></output></label>
  <label>sag <input id="sag" type="range" min="0" max="3" step="0.1" value="0.6"><output></output></label>
  <label>flaws <input id="flaws" type="range" min="1" max="7" step="1" value="4"><output></output></label>
  <label>seed <input id="seed" type="range" min="1" max="20" step="1" value="1"><output></output></label>
</div>
<div id="stage"><canvas id="view" aria-label="A thick skin ripping over a swelling body. Drag to turn, scroll to zoom."></canvas><div id="note" role="status"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="tear.js"></script>
<script>
const T = THREE, $ = (id) => document.getElementById(id), IDS = ['steps', 'strength', 'clench', 'thick', 'expanse', 'tension', 'sag', 'flaws', 'seed'];
const renderer = new T.WebGLRenderer({ canvas: $('view'), antialias: true });
renderer.outputEncoding = T.sRGBEncoding; renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
const scene = new T.Scene(); scene.background = new T.Color(0x14242b);
const cam = new T.PerspectiveCamera(26, 1, 0.05, 100);
scene.add(new T.HemisphereLight(0xeaf2f5, 0x33464e, 0.6));
const sun = new T.DirectionalLight(0xfff3e2, 0.7); sun.position.set(3, 6, 4); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 1, far: 20 }); scene.add(sun);
const fill = new T.DirectionalLight(0xcfe3ee, 0.22); fill.position.set(-4, 2, -3); scene.add(fill);
const floor = new T.Group(); floor.rotation.x = -Math.PI / 2; floor.position.y = -1.02;
floor.add(new T.Mesh(new T.CircleGeometry(20, 64), new T.MeshBasicMaterial({ color: new T.Color(0x41565f).convertSRGBToLinear() })));
const shade = new T.Mesh(new T.CircleGeometry(20, 64), new T.ShadowMaterial({ opacity: 0.3 })); shade.position.z = 0.002; shade.receiveShadow = true; floor.add(shade); scene.add(floor);
const lin = (h) => new T.Color(h).convertSRGBToLinear();
// the sheet is a shade darker and rougher than the membrane, so the two read as different stuff by value alone
const sheetMat = new T.MeshStandardMaterial({ color: lin(0xcfc4b2), roughness: 0.95, side: T.DoubleSide }), memMat = new T.MeshStandardMaterial({ color: lin(0xf0e9de), roughness: 0.6 });
const group = new T.Group(); scene.add(group);
let target = new T.Vector3(0, 0, 0), rad = 8.2, az = 0.6, pol = 1.25, timer = 0;
function place() { cam.position.set(target.x + rad * Math.sin(pol) * Math.sin(az), target.y + rad * Math.cos(pol), target.z + rad * Math.sin(pol) * Math.cos(az)); cam.lookAt(target); renderer.render(scene, cam); }
function fit() { const el = $('stage'); renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(el.clientWidth, el.clientHeight, false); cam.aspect = el.clientWidth / el.clientHeight; cam.updateProjectionMatrix(); place(); }
// the body is inflated a few steps a frame, so the tear can be watched as it runs
let sim = null, made = '', frame = 0;
function draw() {
  const b = sim.mesh();
  while (group.children.length) { group.children[0].geometry.dispose(); group.remove(group.children[0]); }
  for (const [part, mat] of [[b.sheet, sheetMat], [b.membrane, memMat]]) {
    const g = new T.BufferGeometry(); g.setAttribute('position', new T.BufferAttribute(part.pos, 3)); g.setIndex(new T.BufferAttribute(part.idx, 1)); g.computeVertexNormals();
    const m = new T.Mesh(g, mat); m.castShadow = m.receiveShadow = true; group.add(m);
  }
  $('note').textContent = 'step ' + b.step + ': ' + b.snapped + ' of ' + b.links + ' links have ripped, ' + b.out + ' of ' + b.cells + ' cells are bare';
  place();
}
function run() {
  const P = {}; IDS.forEach((id) => { P[id] = +$(id).value; $(id).nextElementSibling.textContent = $(id).value; });
  const now = IDS.filter((id) => id !== 'steps').map((id) => P[id]).join();
  if (!sim || now !== made || sim.step(0) > P.steps) { sim = Tear.start(P); made = now; }
  window.__ready = false; cancelAnimationFrame(frame);
  (function go() { const at = sim.step(0); if (at < P.steps) sim.step(Math.min(5, P.steps - at)); draw(); if (sim.step(0) < P.steps) frame = requestAnimationFrame(go); else window.__ready = true; })();
}
IDS.forEach((id) => $(id).addEventListener('input', () => { $(id).nextElementSibling.textContent = $(id).value; clearTimeout(timer); timer = setTimeout(run, 120); }));
let drag = null;
$('view').addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; $('view').setPointerCapture(e.pointerId); });
$('view').addEventListener('pointerup', () => (drag = null));
$('view').addEventListener('pointermove', (e) => { if (!drag) return; az -= (e.clientX - drag[0]) * 0.008; pol = Math.min(3.05, Math.max(0.08, pol - (e.clientY - drag[1]) * 0.008)); drag = [e.clientX, e.clientY]; place(); });
$('view').addEventListener('wheel', (e) => { e.preventDefault(); rad *= Math.exp(e.deltaY * 0.0012); place(); }, { passive: false });
new ResizeObserver(fit).observe($('stage'));
fit(); run();
window.__tear = { set: (o, a, p, r) => { for (const k in o) $(k).value = o[k]; if (a !== undefined) az = a; if (p !== undefined) pol = p; if (r !== undefined) rad = r; run(); } };
</script>
