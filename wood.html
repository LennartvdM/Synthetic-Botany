<title>Wood Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: five pieces of wood in a row fill the page; one strip of controls above. One trait is varied
   across the row, the rest are held at the sliders. */
:root { color-scheme: dark; --void: #14242b; --panel: #0f1b21; --line: #2a3e46; --ink: #d9e2e3; --dim: #8298a0; --pick: #e6c36a;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; --sans: system-ui, -apple-system, "Segoe UI", sans-serif; }
html, body { height: 100%; margin: 0; }
body { background: var(--panel); color: var(--ink); font: 13px/1.4 var(--sans); display: flex; flex-direction: column; overflow: hidden; }
#bar { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
#bar label { display: grid; grid-template-columns: auto 96px 30px; gap: 6px; align-items: center; color: var(--dim); font: 11.5px var(--mono); }
#bar label.pick { grid-template-columns: auto auto; }
#bar label.off { opacity: 0.4; }
#bar output { color: var(--ink); font-variant-numeric: tabular-nums; text-align: right; }
select { font: 12px var(--mono); color: var(--ink); background: #172a32; border: 1px solid var(--line); border-radius: 4px; padding: 4px 7px; }
input[type="range"] { width: 100%; accent-color: #e4ddd1; }
select:focus-visible, input:focus-visible { outline: 2px solid var(--pick); outline-offset: 1px; }
#stage { position: relative; flex: 1; min-height: 0; background: var(--void); overflow: hidden; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#note { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); bottom: 8px; font: 11px var(--mono); color: var(--ink); background: rgba(15, 27, 33, 0.8); padding: 3px 9px; border-radius: 4px; pointer-events: none; }
</style>

<div id="bar">
  <label class="pick">across the row <select id="vary" aria-label="Which trait differs across the row"></select></label>
</div>
<div id="stage"><canvas id="view" aria-label="Five pieces of wood side by side. Drag to turn, scroll to zoom."></canvas><div id="note" role="status"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="wood.js"></script>
<script>
const T = THREE, $ = (id) => document.getElementById(id);
// each trait: its slider range and value, and the five values it takes when it is the one varied
const TRAITS = { age: [1, 150, 1, 45, [6, 18, 40, 80, 150]], seed: [1, 40, 1, 1, [1, 2, 3, 4, 5]], strands: [1, 16, 1, 9, [2, 5, 9, 12, 16]], girth: [0.04, 0.2, 0.01, 0.1, [0.05, 0.075, 0.1, 0.14, 0.2]], uneven: [0, 1, 0.05, 0.6, [0, 0.25, 0.5, 0.75, 1]],
  twist: [0, 5, 0.1, 0.9, [0, 0.5, 1, 2, 4]], curl: [0, 3.5, 0.1, 1.2, [0, 0.6, 1.2, 2.2, 3.5]], sway: [0, 2, 0.05, 1, [0, 0.5, 1, 1.5, 2]], spread: [0, 1.6, 0.05, 0.8, [0.1, 0.4, 0.8, 1.2, 1.6]], gap: [0, 2.5, 0.05, 0.7, [0, 0.4, 0.8, 1.5, 2.5]],
  flat: [0, 1.4, 0.05, 0.9, [0, 0.35, 0.7, 1, 1.4]], ridge: [0, 1.5, 0.05, 0.9, [0, 0.35, 0.7, 1.1, 1.5]], grain: [0, 1.5, 0.05, 0.8, [0, 0.3, 0.6, 1, 1.5]], roots: [0, 2, 0.05, 0.9, [0, 0.4, 0.9, 1.4, 2]], lift: [-0.5, 1.5, 0.05, 0.5, [-0.5, 0, 0.5, 1, 1.5]],
  fail: [0, 1, 0.05, 0.3, [0, 0.25, 0.5, 0.75, 1]], splinter: [0, 1.5, 0.05, 0.8, [0, 0.4, 0.8, 1.1, 1.5]], decay: [4, 60, 1, 18, [5, 10, 18, 35, 60]], bark: [0, 1.5, 0.05, 0.8, [0, 0.3, 0.7, 1.1, 1.5]], yield: [0.6, 2.5, 0.05, 1.3, [0.7, 1, 1.3, 1.8, 2.5]] };
for (const k in TRAITS) {
  const [lo, hi, step, val] = TRAITS[k], o = document.createElement('option'); o.value = o.textContent = k; $('vary').append(o);
  const l = document.createElement('label'); l.innerHTML = k + ' <input id="' + k + '" type="range" min="' + lo + '" max="' + hi + '" step="' + step + '" value="' + val + '"><output>' + val + '</output>'; $('bar').append(l);
}
const renderer = new T.WebGLRenderer({ canvas: $('view'), antialias: true });
renderer.outputEncoding = T.sRGBEncoding; renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
const scene = new T.Scene(); scene.background = new T.Color(0x14242b);
const cam = new T.PerspectiveCamera(24, 1, 0.05, 200);
scene.add(new T.HemisphereLight(0xeaf2f5, 0x3a4d55, 0.62));
const sun = new T.DirectionalLight(0xfff3e2, 0.66); sun.position.set(4, 9, 6); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.012;
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 40 }); scene.add(sun);
const fill = new T.DirectionalLight(0xcfe3ee, 0.2); fill.position.set(-5, 3, -4); scene.add(fill);
const floor = new T.Group(); floor.rotation.x = -Math.PI / 2;
floor.add(new T.Mesh(new T.CircleGeometry(40, 64), new T.MeshBasicMaterial({ color: new T.Color(0x41565f).convertSRGBToLinear() })));
const shade = new T.Mesh(new T.CircleGeometry(40, 64), new T.ShadowMaterial({ opacity: 0.3 })); shade.position.z = 0.002; shade.receiveShadow = true; floor.add(shade); scene.add(floor);
const mat = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, side: T.DoubleSide });
const lin = (h) => new T.Color(h).convertSRGBToLinear(), clay = lin(0xe7e0d4), deep = lin(0x8d7a78);
const group = new T.Group(); scene.add(group);
let target = new T.Vector3(0, 1.3, 0), rad = 16, az = 0.55, pol = 1.3, timer = 0;
function place() { cam.position.set(target.x + rad * Math.sin(pol) * Math.sin(az), target.y + rad * Math.cos(pol), target.z + rad * Math.sin(pol) * Math.cos(az)); cam.lookAt(target); renderer.render(scene, cam); }
function fit() { const el = $('stage'); renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(el.clientWidth, el.clientHeight, false); cam.aspect = el.clientWidth / el.clientHeight; cam.updateProjectionMatrix(); place(); }
function show() {
  const vary = $('vary').value, P = {}; for (const k in TRAITS) { P[k] = +$(k).value; $(k).nextElementSibling.textContent = $(k).value; $(k).parentElement.classList.toggle('off', k === vary); }
  while (group.children.length) { group.children[0].geometry.dispose(); group.remove(group.children[0]); }
  TRAITS[vary][4].forEach((v, i) => {
    const b = Wood.grow(Object.assign({}, P, { [vary]: v })), col = new Float32Array(b.tone.length * 3);
    for (let q = 0; q < b.tone.length; q++) { const k = Math.pow(Math.min(1, Math.max(0, b.tone[q])), 1.3), l = 0.36 + 0.64 * k; col[q * 3] = (deep.r + (clay.r - deep.r) * k) * l; col[q * 3 + 1] = (deep.g + (clay.g - deep.g) * k) * l; col[q * 3 + 2] = (deep.b + (clay.b - deep.b) * k) * l; }
    const g = new T.BufferGeometry(); g.setAttribute('position', new T.BufferAttribute(b.pos, 3)); g.setAttribute('normal', new T.BufferAttribute(b.nrm, 3)); g.setAttribute('color', new T.BufferAttribute(col, 3)); g.setIndex(new T.BufferAttribute(b.idx, 1));
    const m = new T.Mesh(g, mat); m.castShadow = m.receiveShadow = true; m.position.x = (i - 2) * 3.1; group.add(m);
  });
  $('note').textContent = (vary === 'age' ? 'years' : vary) + ' across the row: ' + TRAITS[vary][4].join(', ') + '. Everything else as set above.';
  place(); window.__ready = true;
}
$('bar').addEventListener('input', (e) => { if (e.target.type === 'range') e.target.nextElementSibling.textContent = e.target.value; clearTimeout(timer); timer = setTimeout(show, 120); });
let drag = null;
$('view').addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; $('view').setPointerCapture(e.pointerId); });
$('view').addEventListener('pointerup', () => (drag = null));
$('view').addEventListener('pointermove', (e) => { if (!drag) return; az -= (e.clientX - drag[0]) * 0.008; pol = Math.min(3.05, Math.max(0.08, pol - (e.clientY - drag[1]) * 0.008)); drag = [e.clientX, e.clientY]; place(); });
$('view').addEventListener('wheel', (e) => { e.preventDefault(); rad *= Math.exp(e.deltaY * 0.0012); place(); }, { passive: false });
new ResizeObserver(fit).observe($('stage'));
fit(); show();
window.__wood = { set: (o, a, p, r, ty) => { for (const k in o) $(k).value = o[k]; if (a !== undefined) az = a; if (p !== undefined) pol = p; if (r !== undefined) rad = r; if (ty !== undefined) target.y = ty; show(); } };
</script>
